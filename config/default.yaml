# LMTrade default configuration.
# Environment variables (LMTRADE_*) override anything set here.
# See .env.example for the full list.

mode: paper                # paper | live
budget: 100.0              # starting cash, account currency (paper default;
                           # ~1 EUR flat fees are a 10% drag at 10 EUR scale)
currency: EUR

universe:                  # instruments to trade. Mixes US equities (live
                           # only during NYSE hours + extended hours) with
                           # crypto (trades 24/7) so the feed never fully
                           # goes stale overnight or outside market hours.
  - AAPL
  - MSFT
  - SPY
  - BTC-USD
  - ETH-USD

loop:
  interval_seconds: 15     # high-cadence intraday loop (TR can't do true HFT;
                           # sub-second execution is impossible via its API)
  max_positions: 5         # cap concurrent open positions (one per universe
                           # symbol at most — each symbol only ever holds one)

model:
  stack: [heuristic, slm, perplexity]   # providers consulted, in order
  slm_model: "qwen2.5:1.5b"             # T4-sized; use qwen2.5:7b on an A100
  cloud_model: "claude-haiku-4-5-20251001"
  perplexity_model: "sonar"
  weights:
    heuristic: 1.0
    slm: 1.0
    cloud: 1.5
    perplexity: 1.2
    strategy: 1.5          # the learned strategy genome's vote
    news: 1.0              # hourly news sentiment vote
    analysis: 1.5          # daily Claude market-analysis bias

risk:
  max_position_fraction: 0.5
  stop_loss_pct: 0.05
  take_profit_pct: 0.08
  min_confidence: 0.55

options:                   # synthetic Black-Scholes options layer (paper)
  enabled: true
  expiry_days: 7
  max_option_fraction: 0.3   # max fraction of equity in one premium
  take_profit_pct: 0.5       # +50% premium -> take profit
  stop_loss_pct: 0.4         # -40% premium -> cut
  min_hours_to_expiry: 24    # force-close inside this window

learning:                  # evolutionary strategy optimizer
  enabled: true
  population: 8
  epsilon: 0.2               # exploration rate
  mutation_scale: 0.3
  evolve_every_trades: 10

research:
  news_interval_minutes: 60          # hourly Perplexity news
  daily_analysis_interval_hours: 24  # daily Claude strategy review

benchmark:
  symbol: SPY              # "retail baseline": buy-and-hold SPY

economics:
  gpu_usd_per_hour: 0.20       # Vast.ai hourly burn (T4 ~0.15-0.25, A100 ~0.6-1.1)
  min_runway_hours: 6
  inference_cost:
    slm: 0.0002
    cloud: 0.004
    perplexity: 0.005

web:
  host: "0.0.0.0"
  port: 8000

data:
  provider: auto             # auto | yahoo | synthetic (legacy "yfinance" name
                             # still accepted — see data/market.py)
  intraday: true             # 1m bars when the live Yahoo feed is available
